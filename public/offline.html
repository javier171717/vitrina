<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Sin conexión · Vitrina</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", sans-serif; background: #f4f1ec; color: #141416;
      padding: 24px; text-align: center;
    }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { color: #6b6560; margin: 0 0 22px; line-height: 1.5; }
    button {
      border: 0; border-radius: 999px; padding: 12px 20px; background: #e30613; color: #fff;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>Sin conexión</h1>
    <p>No hay internet ahora. Revisa la red e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
